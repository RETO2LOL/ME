<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AionSeeker.dev - Personal Portfolio" />
    <title>AionSeeker.dev Portfolio</title>
    <script>
      // Hide before the first paint; keep content accessible if main.js fails.
      if ("IntersectionObserver" in window) {
        document.documentElement.classList.add("reveal-enabled");
        document.addEventListener("DOMContentLoaded", function () {
          if (!document.documentElement.classList.contains("reveal-ready")) {
            document.documentElement.classList.remove("reveal-enabled");
          }
        }, { once: true });
      }
    </script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/ec1fea3f7e.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://www.google.com/recaptcha/api.js?render=6Lejwp0tAAAAADsvhe3qxuCBg5FT61je8Bj5Chrl"></script>
    <link rel="stylesheet" href="my-react-widget/dist/assets/react-widget.css" />
  </head>
  <body>
    <!-- Background elements -->
    <div id="dots" aria-hidden="true"></div>

    <!-- Header (React widget mounts here) -->
    <header id="home" data-nav-section data-reveal>
      <div id="hero-root"></div>
    </header>

    <div class="line1"></div>

    <!-- My Projects -->

    <section id="projects" data-nav-section data-reveal>
      <h1 class="MainHeader3">My Projects</h1>
      <div class="cards">
        <div class="card">
          <div class="card-con">
            <i class="fa-solid fa-ban"></i>
            <span class="cardText">For future Projects</span>
          </div>
        </div>
        <div class="card">
          <div class="card-con">
            <i class="fa-solid fa-ban"></i>
            <span class="cardText">For future Projects</span>
          </div>
        </div>
        <div class="card">
          <div class="card-con">
            <i class="fa-solid fa-ban"></i>
            <span class="cardText">For future Projects</span>
          </div>
        </div>
      </div>
    </section>
    <!-- About Me & Skills -->
    <div class="line1"></div>
    <section id="about" data-nav-section data-reveal>
      <h1 class="AboutMeHeader" id="AboutMeNavigation">About me</h1>
      <div class="about-skills-row">
        <div class="AboutMeCard">
          <div class="AboutMeImage"><i class="fa-solid fa-circle-user"></i></div>
          <h1 class="AboutMeMainHeader">Ammar Yasser</h1>
          <p class="AboutMeDiscription">software dev</p>
        </div>
        <section id="Skills">
        </section>
      </div>
    </section>
    <!--constact me section-->
    <div class="line1"></div>
    <section id="contact" data-nav-section data-reveal>
      <h1 class="MainHeader3">Contact me</h1>
      <div class="contactCard">
        <p class="contactBlurb">
          Have a project in mind or just want to say hi? Drop a message below.
        </p>
        <form id="contactForm" class="contactForm" novalidate>
          <input type="text" name="name" placeholder="Your name" required />
          <input type="email" name="email" placeholder="Your email" required />
          <textarea
            name="message"
            placeholder="Your message"
            rows="5"
            required
          ></textarea>
          <button type="submit" class="contactSubmit">
            Send message <i class="fa-solid fa-paper-plane"></i>
          </button>
          <p id="contactError" class="contactError" hidden></p>
        </form>
        <div id="contactThanks" class="contactThanks" hidden>
          <svg class="contactSuccessIcon" viewBox="0 0 96 96" aria-hidden="true">
            <circle class="contactSuccessCircle" cx="48" cy="48" r="39"></circle>
            <path class="contactSuccessCheck" d="m29 49 12 12 27-29"></path>
          </svg>
          <p>Thanks — I'll be in touch.</p>
        </div>
      </div>
    </section>

    <!-- Footer (React widget mounts here) -->
    <div id="footer-root"></div>

    <!-- Navbar -->
    <footer id="nav">
      <div class="navbar">
        <button id="toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
          <i class="fa-regular fa-lightbulb" aria-hidden="true"></i>
        </button>
        <ul>
          <li value="0"><a href="#home" aria-label="Home"><i class="fa-regular fa-house"></i></a></li>
          <li value="1"><a href="#projects" aria-label="Projects"><i class="fa-regular fa-file-code"></i></a></li>
          <li value="2"><a href="#about" aria-label="About me"><i class="fa-regular fa-circle-user"></i></a></li>
          <li value="3"><a href="#contact" aria-label="Contact"><i class="fa-regular fa-envelope"></i></a></li>
        </ul>
        <div id="circle" aria-hidden="true"><i class="fa-regular fa-house"></i></div>
      </div>
    </footer>

    <!-- React widget bundle + mount. Navigation observes the host sections. -->
    <script src="my-react-widget/dist/assets/react-widget.js"></script>
    <script>
      // The preceding bundle defines window.renderMyReactWidget.
      var heroEl = document.getElementById("hero-root");
      var footerEl = document.getElementById("footer-root");
      if (heroEl) {
        window.renderMyReactWidget("hero-root", { section: "hero" });
      }
      if (footerEl) {
        window.renderMyReactWidget("footer-root", { section: "footer" });
      }
    </script>
    <script src="main.js" defer></script>
  </body>
</html>
